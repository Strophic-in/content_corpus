# /etc/nginx/sites-available/content-corpus.strophic.in (symlinked into sites-enabled).
# TLS: `sudo certbot --nginx -d content-corpus.strophic.in` adds the certificate
# lines to the 443 block below and renews them; see docs/DEPLOY.md.

upstream content_corpus_web {
    server 127.0.0.1:3400;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name content-corpus.strophic.in;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name content-corpus.strophic.in;

    ssl_certificate     /etc/letsencrypt/live/content-corpus.strophic.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/content-corpus.strophic.in/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 2m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    # The owner's own footage, streamed through the web app into storage (up to
    # 300 MB a file): unbuffered, and allowed to take a while on a slow uplink.
    location /api/upload/ {
        client_max_body_size 310m;
        proxy_request_buffering off;
        proxy_pass http://content_corpus_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        client_body_timeout 300s;
    }

    location / {
        proxy_pass http://content_corpus_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }
}
